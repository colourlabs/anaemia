name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm build

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: format check
        run: pnpm fmt:check

      - name: test
        run: pnpm test

      - name: install playwright
        run: pnpm --filter @anaemia/core exec playwright install --with-deps

      # `pnpm test:integration` (root script) rebuilds the workspace first, so
      # the fixture in production.test.mjs is rewired against freshly built
      # @anaemia/* packages rather than whatever the template cached on the last
      # published release.
      - name: test integration
        run: pnpm test:integration
