packages:
  - "packages/*"
  - "templates/*"
overrides:
  "@rspack/core": ^2.0.5
  "@rspack/binding": ^2.0.5
  "@rspack/dev-server": ^2.0.2

  # this is for templates/* which depend on @anaemia/core but don't have access to the workspace protocol
  "@anaemia/core": workspace:*
  "@anaemia/bundler": workspace:*
  "@anaemia/cli": workspace:*
  "@anaemia/plugin-mdx": workspace:*
  "@anaemia/eslint-plugin": workspace:*
allowBuilds:
  "@parcel/watcher": true
  simple-git-hooks: true

pnpm:
  # pnpm <=11 field (packageManager is pinned to pnpm@11.5.2). required so CI's
  # `pnpm install --frozen-lockfile` runs these build scripts instead of failing
  # with "Ignored build scripts" - the template apps use the same key.
  onlyBuiltDependencies:
    - "@parcel/watcher"
    - simple-git-hooks
