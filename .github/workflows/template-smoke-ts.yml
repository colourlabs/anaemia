name: Template smoke test (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "packages/**"
  pull_request:
    paths:
      - "templates/**"
      - "packages/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: scaffold fresh project (TS template)
        run: |
          mkdir /tmp/smoke-test
          node packages/cli/dist/index.js create smoke-app --dir /tmp/smoke-test --template ts

      - name: install project deps
        working-directory: /tmp/smoke-test
        run: pnpm install

      - name: build project
        working-directory: /tmp/smoke-test
        run: pnpm build

      - name: typecheck project
        working-directory: /tmp/smoke-test
        run: pnpm typecheck
