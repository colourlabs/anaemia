name: Template smoke test (JavaScript)

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "packages/**"
  pull_request:
    paths:
      - "templates/**"
      - "packages/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: pack locally built packages
        run: |
          mkdir -p /tmp/anaemia-pkgs
          for pkg in core bundler cli plugin-mdx eslint-plugin; do
            pnpm --filter "@anaemia/$pkg" pack --pack-destination /tmp/anaemia-pkgs
          done

      - name: scaffold fresh project (JS template)
        run: |
          mkdir /tmp/smoke-test
          node packages/cli/dist/index.js create smoke-app --dir /tmp/smoke-test --template js

      - name: point project at locally built packages
        run: node scripts/setup-smoke-app.mjs --app /tmp/smoke-test --pkgs /tmp/anaemia-pkgs

      - name: install project deps
        working-directory: /tmp/smoke-test
        run: pnpm install

      - name: build project
        working-directory: /tmp/smoke-test
        run: pnpm build
