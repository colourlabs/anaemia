name: Template smoke test (JavaScript)

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'packages/**'
  pull_request:
    paths:
      - 'templates/**'
      - 'packages/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: scaffold fresh project (JS template)
        run: |
          mkdir /tmp/smoke-test
          node packages/cli/dist/index.js create smoke-app --dir /tmp/smoke-test --template js

      - name: install project deps
        working-directory: /tmp/smoke-test
        run: pnpm install

      - name: build project
        working-directory: /tmp/smoke-test
        run: pnpm build