packages:
  - "packages/*"
  - "templates/*"
overrides:
  "@rspack/core": ^2.2.3
  "@rspack/binding": ^2.2.3
  "@rspack/dev-server": ^2.2.1

  # this is for templates/* which depend on @anaemia/core but don't have access to the workspace protocol
  "@anaemia/core": workspace:*
  "@anaemia/bundler": workspace:*
  "@anaemia/cli": workspace:*
  "@anaemia/plugin-mdx": workspace:*
  "@anaemia/eslint-plugin": workspace:*
allowBuilds:
  # `allowBuilds` (map form) is the pnpm v11+ key for approving dependency build
  # scripts, read from pnpm-workspace.yaml. Without these, `pnpm install` fails
  # with "Ignored build scripts: @parcel/watcher, simple-git-hooks".
  "@parcel/watcher": true
  simple-git-hooks: true
